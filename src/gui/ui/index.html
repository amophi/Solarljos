<!doctype html>
<!--
  Solarljos's page. The words below are only what shows before app.js runs: it puts every
  string in from strings.js, or from the language chosen, by its data-i18n key. No script or
  style is inline, and nothing is loaded from anywhere but the server that sent this page: the
  three files beside this one, by names relative to it, which are also the names they have in the
  built program (and lang/<code>.json, which app.js asks for when a language is chosen). The
  icons are drawn here, as SVG, with nothing in them but paths.

  The frame is a rail at the start of the window -- the left in English, the right in Arabic --
  with the three things to find first, then what is searched and the help, then the language
  and Quit. In a narrow window it keeps only its icons; the button at its top shows the words.
-->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<meta name="color-scheme" content="light dark">
<title data-i18n="app.name">Solarljos</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main" data-i18n="app.skip">Skip to main content</a>
<div class="app" id="app">
  <header class="rail" id="rail">
    <div class="rail-top">
      <button type="button" class="rail-toggle" id="rail-toggle" aria-expanded="true" aria-controls="rail-nav" data-i18n-attr="aria-label:nav.toggle;title:nav.toggle">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>
      </button>
      <a class="brand" href="#/" data-route="">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle class="logo-sun" cx="12" cy="12" r="4.5"/><path class="logo-rays" d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.55 1.55M17.15 17.15l1.55 1.55M5.3 18.7l1.55-1.55M17.15 6.85l1.55-1.55"/></svg>
        <span class="brand-name label" data-i18n="app.name">Solarljos</span>
      </a>
    </div>
    <nav class="rail-nav" id="rail-nav" aria-label="Main" data-i18n-attr="aria-label:nav.label">
      <ul class="nav">
        <li><a href="#/find" data-route="find">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3 20.5 20.5"/></svg>
          <span class="label" data-i18n="nav.find">Find a file</span></a></li>
        <li><a href="#/media" data-route="media">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m4 17.5 4.8-4.6a1.5 1.5 0 0 1 2.1 0l1.6 1.6 2.6-2.6a1.5 1.5 0 0 1 2.1 0l3.3 3.2"/></svg>
          <span class="label" data-i18n="nav.media">Photos and videos</span></a></li>
        <li><a href="#/folder" data-route="folder">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.6l2 2h7.4a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><path d="M9.5 13.5h5M12.5 11.2l2.3 2.3-2.3 2.3"/></svg>
          <span class="label" data-i18n="nav.folder">Bring back a folder</span></a></li>
      </ul>
      <ul class="nav nav-more">
        <li><a href="#/sources" data-route="sources">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m12 4 8.5 4.5L12 13 3.5 8.5z"/><path d="m3.5 12.5 8.5 4.5 8.5-4.5M3.5 16.2l8.5 4.3 8.5-4.3"/></svg>
          <span class="label" data-i18n="nav.sources">What is searched</span></a></li>
        <li><a href="#/help" data-route="help">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.5"/><path d="M12 16.6v.1"/></svg>
          <span class="label" data-i18n="nav.help">Help</span></a></li>
      </ul>
    </nav>
    <div class="rail-foot">
      <div class="lang-pick" id="lang-pick" hidden>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.3 2.4 3.5 5.2 3.5 8.5s-1.2 6.1-3.5 8.5c-2.3-2.4-3.5-5.2-3.5-8.5S9.7 5.9 12 3.5z"/></svg>
        <label class="sr-only" for="lang" data-i18n="lang.label">Language</label>
        <span class="select-box"><select id="lang" class="lang-select" data-i18n-attr="title:lang.label"></select></span>
      </div>
      <button type="button" id="quit" class="rail-item quit">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3.8v7.4"/><path d="M7.2 6.6a7.2 7.2 0 1 0 9.6 0"/></svg>
        <span class="label" data-i18n="nav.quit">Quit</span>
      </button>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
</div>
<div id="status" class="sr-only" role="status" aria-live="polite"></div>
<div id="alert" class="sr-only" role="alert" aria-live="assertive"></div>
<script src="strings.js"></script>
<script src="app.js"></script>
</body>
</html>
