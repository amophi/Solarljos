<!doctype html>
<!--
  Solarljos's page. The words below are only what shows before app.js runs: it puts every
  string in from strings.js, or from the language chosen, by its data-i18n key. No script or
  style is inline, and nothing is loaded from anywhere but the server that sent this page: the
  three files beside this one, by names relative to it, which are also the names they have in the
  built program (and lang/<code>.json, which app.js asks for when a language is chosen). The
  icons are drawn here, as SVG, with nothing in them but paths.

  The frame is one bar at the top, as in the SoundVisualizer app: the sun and the name, which lead
  to the start; a row of text tabs, one for each part of the page (a tablist: the arrow keys move
  along it, and Ctrl+1 to Ctrl+5 go to each part from anywhere); and at the end the language, the
  light or dark theme and Quit. Where the tabs do not fit beside the rest they take a row of their
  own, which scrolls sideways when it is still too narrow. It mirrors in Arabic.
-->
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<meta name="color-scheme" content="dark light">
<title data-i18n="app.name">Solarljos</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main" data-i18n="app.skip">Skip to main content</a>
<div class="app" id="app">
  <header class="topbar" id="topbar">
    <a class="brand" href="#/" data-route="">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle class="logo-sun" cx="12" cy="12" r="4.5"/><path class="logo-rays" d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.55 1.55M17.15 17.15l1.55 1.55M5.3 18.7l1.55-1.55M17.15 6.85l1.55-1.55"/></svg>
      <span class="brand-name" data-i18n="app.name">Solarljos</span>
    </a>
    <nav class="tabs-nav" id="tabs-nav" aria-label="Main" data-i18n-attr="aria-label:nav.label">
      <div class="tab-row" role="tablist" aria-label="Main" data-i18n-attr="aria-label:nav.label">
        <a class="top-tab" role="tab" href="#/find" data-route="find" aria-selected="false" tabindex="-1" aria-controls="main" data-i18n="nav.find">Find a file</a>
        <a class="top-tab" role="tab" href="#/media" data-route="media" aria-selected="false" tabindex="-1" aria-controls="main" data-i18n="nav.media">Photos and videos</a>
        <a class="top-tab" role="tab" href="#/folder" data-route="folder" aria-selected="false" tabindex="-1" aria-controls="main" data-i18n="nav.folder">Bring back a folder</a>
        <a class="top-tab" role="tab" href="#/sources" data-route="sources" aria-selected="false" tabindex="-1" aria-controls="main" data-i18n="nav.sources">What is searched</a>
        <a class="top-tab" role="tab" href="#/help" data-route="help" aria-selected="false" tabindex="-1" aria-controls="main" data-i18n="nav.help">Help</a>
      </div>
    </nav>
    <div class="topbar-tools">
      <div class="lang-pick" id="lang-pick" hidden>
        <label class="sr-only" for="lang" data-i18n="lang.label">Language</label>
        <span class="select-box lang-box">
          <svg class="icon lang-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.3 3.6 5.1 3.6 8.5s-1.2 6.2-3.6 8.5M12 3.5C9.6 5.8 8.4 8.6 8.4 12s1.2 6.2 3.6 8.5"/></svg>
          <select id="lang" class="lang-select" title="Language" data-i18n-attr="title:lang.label"></select>
        </span>
      </div>
      <button type="button" class="btn quiet icon-only theme-toggle" id="theme">
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M5.5 18.5l1.4-1.4M17.1 6.9l1.4-1.4"/></svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19.5 14.6A7.8 7.8 0 0 1 9.4 4.5a7.8 7.8 0 1 0 10.1 10.1z"/></svg>
      </button>
      <button type="button" id="quit" class="btn quiet quit">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3.8v7.4"/><path d="M7.2 6.6a7.2 7.2 0 1 0 9.6 0"/></svg>
        <span data-i18n="nav.quit">Quit</span>
      </button>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
</div>
<div id="status" class="sr-only" role="status" aria-live="polite"></div>
<div id="alert" class="sr-only" role="alert" aria-live="assertive"></div>
<script src="strings.js"></script>
<script src="app.js"></script>
</body>
</html>
