# On a v* tag: builds the Windows program on Windows with the Node and the .NET SDK pinned below
# (global.json), runs the tests, lets scripts/build-desktop.js try what it built, and attaches to
# the GitHub release of that tag, making the release when there is none yet:
#   Solarljos-<version>-win-x64.zip   the window (Solarljos.exe, WPF, which needs the .NET 10
#                                     Desktop Runtime) and the engine it starts (solarljos-core.exe,
#                                     the program scripts/build-exe.js makes), with their licences
#   solarljos.cjs                     the bundle inside the engine: the command line alone, for Node 22
#                                     or later
# and the SHA-256 of each. Nothing from npm or NuGet is installed.
#
# The Node version is exact because the engine is that very node.exe, less its signature, with the
# bundle inside; the SDK is exact because the compiler is part of what the window is. The same tag
# built with the same two gives the same bytes, in whatever folder it is checked out (every path is
# named from the project), so anyone can check a download by building it again. --build-sea needs
# Node 25.5 or later. ci.yml builds and tries the program the same way on every push, so a tag
# rarely meets a build that fails.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write       # make the release and upload to it
  id-token: write       # sign the build provenance (Sigstore)
  attestations: write   # checked with: gh attestation verify <file> -R amophi/Solarljos (the zip, either exe, solarljos.cjs)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.10.0'
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: The tag is the version in package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match package.json's version $version."
            exit 1
          fi
      - run: npm test
      - run: node scripts/build-desktop.js
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/Solarljos-*-win-x64.zip
            dist/desktop/Solarljos.exe
            dist/desktop/Solarljos.dll
            dist/desktop/solarljos-core.exe
            dist/solarljos.cjs
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            pre=()
            case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; esac
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Solarljos ${GITHUB_REF_NAME#v}" --generate-notes "${pre[@]}"
          fi
          zip="dist/Solarljos-${GITHUB_REF_NAME#v}-win-x64.zip"
          gh release upload "$GITHUB_REF_NAME" "$zip" "$zip.sha256" \
            dist/solarljos.cjs dist/solarljos.cjs.sha256 --clobber
