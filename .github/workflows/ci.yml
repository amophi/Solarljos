name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # test/bundle.test.js bundles the tree and runs the bundle too.
      - run: npm test

  # The Windows program as release.yml builds it, with the same Node and the same .NET SDK
  # (global.json), and tried by scripts/build-desktop.js itself, which builds the engine with
  # scripts/build-exe.js and tries it too: what breaks either -- a change in --build-sea, a page
  # file the server cannot find, a XAML error, an icon the page renamed -- shows here, before a v*
  # tag is pushed rather than after. Nothing is uploaded.
  exe:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.10.0'
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: node scripts/build-desktop.js
